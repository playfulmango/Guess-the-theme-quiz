<link rel="stylesheet" href="style.css">

<!-- APP TITLE & START SCREEN -->
<div id="start-screen">
 <!-- GAMEPLAY SCREEN -->
<div id="game-screen" class="hidden">
  <div id="timer-display">Time Left: <span id="countdown">20</span>s</div>
  <h2 id="theme-display">Theme: </h2>
  <p id="question-text">Question will appear here</p>
  
  <!-- Answer Buttons -->
  <div id="answers-container">
    <button class="answer-btn" id="btn-0">Option 1</button>
    <button class="answer-btn" id="btn-1">Option 2</button>
    <button class="answer-btn" id="btn-2">Option 3</button>
    <button class="answer-btn" id="btn-3">Option 4</button>
  </div>
</div>
  <h1>Guess the Theme</h1>
  <p>Enter your game code to start playing!</p>
  
  <!-- Text telling the user what code to use -->
  <p><strong>Game Code: 1234</strong></p>
  
  <!-- Text box for entering the game code -->
  <input type="text" id="game-code-input" placeholder="Enter Game Code">
  
  <!-- Play button -->
  <button id="play-btn">Play</button>
</div>
